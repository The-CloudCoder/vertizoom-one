services:
  postgres:
    image: postgres:16-alpine
    container_name: vertizoom-one-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vertizoom_one
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - vertizoom_one_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vertizoom_one"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  vertizoom_one_pgdata:

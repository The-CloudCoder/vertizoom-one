name: CI

on:
  push:
    branches:
      - main
      - setup/project-foundation
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configure CI environment
        run: printf 'DATABASE_URL=postgresql://postgres:postgres@localhost:5432/vertizoom_one?schema=public\n' > .env

      - name: Install dependencies
        run: npm install

      - name: Build all workspaces
        run: npm run build

      - name: Type-check all workspaces
        run: npm run typecheck
